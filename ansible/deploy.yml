- hosts: all
  become: yes
  tasks:
    - name: Ensure Java is installed
      apt:
        name: openjdk-11-jre
        state: present
    
    - name: Ensure deployment directory exists
      file:
        path: /opt/devops-java-webapp
        state: directory
        mode: '0755'

    - name: Copy application JAR file to target server
      copy:
        src: "{{ playbook_dir }}/../target/devops-java-webapp-0.0.1-SNAPSHOT.jar"
        dest: /opt/devops-java-webapp/app.jar
        mode: '0755'

    - name: Create a systemd service file for the application
      copy:
        dest: /etc/systemd/system/devops-java-webapp.service
        content: |
          [Unit]
          Description=DevOps Java Web Application
          After=network.target

          [Service]
          User=root
          ExecStart=/usr/bin/java -Dserver.port=8081 -jar /opt/devops-java-webapp/app.jar
          SuccessExitStatus=143
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: Start and enable the application service
      systemd:
        name: devops-java-webapp
        state: started
        enabled: yes

    - name: Ensure the application is running
      uri:
        url: http://localhost:8081
        status_code: 200
      register: result
      until: result.status == 200
      retries: 10
      delay: 5

    - name: Fail if the application is not reachable
      fail:
        msg: "The application is not running!"
      when: result.status != 200
